# Build + unit tests on every push/PR. Runs on an Apple Silicon macOS runner.
# (The UI acceptance test — make ui-test — needs live SMC hardware and
# Accessibility permission, so it stays a dev-machine test.)
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "app/**"
      - "assets/AppIcon.icns"   # bundled into the app; verified by CI
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "app/**"
      - "assets/AppIcon.icns"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    # Both SDKs: macos-15 guards the deployment floor, macos-26 matches what
    # the bottle ships with (newest SDK = current system appearance).
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Assemble app bundle
        run: make app

      - name: Verify bundle
        run: |
          plutil -lint build/Fanknob.app/Contents/Info.plist
          test -x build/Fanknob.app/Contents/MacOS/FanknobApp
          test -f build/Fanknob.app/Contents/Resources/AppIcon.icns
