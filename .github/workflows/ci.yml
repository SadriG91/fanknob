# Build + unit tests on every push/PR. Runs on an Apple Silicon macOS runner.
# (The UI acceptance test — make ui-test — needs live SMC hardware and
# Accessibility permission, so it stays a dev-machine test.)
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "app/**"
      - "assets/AppIcon.icns"   # bundled into the app; verified by CI
      - "packaging/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "app/**"
      - "assets/AppIcon.icns"
      - "packaging/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    # Both SDKs: macos-15 guards the deployment floor, macos-26 matches what
    # releases are built with (newest SDK = current system appearance).
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Assemble app bundle
        run: make app

      - name: Verify bundle
        run: |
          plutil -lint build/Fanknob.app/Contents/Info.plist
          test -x build/Fanknob.app/Contents/MacOS/FanknobApp
          test -f build/Fanknob.app/Contents/Resources/AppIcon.icns

      # The package is what users actually install, so a broken payload layout
      # should fail here rather than at release time. Unsigned is fine — the
      # signing half needs secrets that pull requests can't have.
      - name: Build the installer package (unsigned)
        run: make pkg

      - name: Verify the package payload
        run: |
          VERSION=$(make -s print-version)
          PKG="build/Fanknob-$VERSION.pkg"
          test -f "$PKG"
          # Not named `path`: that's tied to PATH in zsh, and this snippet gets
          # copy-pasted into terminals.
          for entry in ./usr/local/bin/fanknob \
                       ./usr/local/bin/fanknobd \
                       ./Library/LaunchDaemons/com.fanknob.daemon.plist \
                       ./Applications/Fanknob.app; do
            pkgutil --payload-files "$PKG" | grep -qx "$entry" || {
              echo "::error::$entry missing from the package payload"; exit 1; }
          done
          # The bundle must carry the version the package claims.
          STAMPED=$(plutil -extract CFBundleShortVersionString raw build/Fanknob.app/Contents/Info.plist)
          test "$STAMPED" = "$VERSION" || {
            echo "::error::bundle says $STAMPED, package says $VERSION"; exit 1; }
