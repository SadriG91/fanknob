# Build + unit tests on every push/PR. Runs on an Apple Silicon macOS runner.
# (The UI acceptance test — make ui-test — needs live SMC hardware and
# Accessibility permission, so it stays a dev-machine test.)
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "app/**"
      - "assets/AppIcon.icns"   # bundled into the app; verified by CI
      - "packaging/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "app/**"
      - "assets/AppIcon.icns"
      - "packaging/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    # Both SDKs: macos-15 guards the deployment floor, macos-26 matches what
    # releases are built with (newest SDK = current system appearance).
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Assemble app bundle
        run: make app

      - name: Verify bundle
        run: |
          plutil -lint build/Fanknob.app/Contents/Info.plist
          test -x build/Fanknob.app/Contents/MacOS/FanknobApp
          test -f build/Fanknob.app/Contents/Resources/AppIcon.icns

      # Unsigned: the signing half needs secrets pull requests can't have.
      - name: Build the installer package (unsigned)
        run: make pkg

      - name: Verify the package payload
        run: |
          VERSION=$(make -s print-version)
          PKG="build/Fanknob-$VERSION.pkg"
          test -f "$PKG"
          for entry in ./usr/local/bin/fanknob \
                       ./usr/local/bin/fanknobd \
                       ./Library/LaunchDaemons/com.fanknob.daemon.plist \
                       ./Applications/Fanknob.app; do
            pkgutil --payload-files "$PKG" | grep -qx "$entry" || {
              echo "::error::$entry missing from the package payload"; exit 1; }
          done

          STAMPED=$(plutil -extract CFBundleShortVersionString raw build/Fanknob.app/Contents/Info.plist)
          test "$STAMPED" = "$VERSION" || {
            echo "::error::bundle says $STAMPED, package says $VERSION"; exit 1; }

          # Relocatable bundles let Installer honour a LaunchServices
          # registration and install over some other copy of Fanknob.app,
          # leaving /Applications empty. Shipped that way in 1.4.0; the payload
          # checks above passed the whole time.
          ( cd "$RUNNER_TEMP" && rm -rf pkginfo && mkdir pkginfo && cd pkginfo \
            && xar -xf "$GITHUB_WORKSPACE/$PKG" component.pkg/PackageInfo )
          grep -q 'relocatable="false"' "$RUNNER_TEMP/pkginfo/component.pkg/PackageInfo" || {
            echo "::error::app bundle is relocatable — it may not install to /Applications"; exit 1; }

          # The preinstall is what stops the package landing on top of a copy
          # built from source; the Makefile guards the other direction. Losing
          # it would be silent, so check it made it into the package.
          grep -q 'preinstall' "$RUNNER_TEMP/pkginfo/component.pkg/PackageInfo" || {
            echo "::error::preinstall guard missing from the package"; exit 1; }
