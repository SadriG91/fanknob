name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "docs/**"
      - "scripts/check-docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "docs/**"
      - "scripts/check-docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local links and assets
        run: python3 scripts/check-docs.py
